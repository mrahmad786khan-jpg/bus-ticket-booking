<!DOCTYPE html>
<html lang="en">
<head>
  <head>
  <!-- Baaki ke head elements (title, meta, etc.) -->

  <!-- Google Translate Top Banner Force Hide -->
  <style type="text/css">
    iframe.goog-te-banner-frame,
    .goog-te-banner-frame,
    .goog-te-banner,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    div.skiptranslate,
    #google_translate_element .goog-te-gadget-simple {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
    }

    body {
      top: 0px !important;
      position: static !important;
      min-height: 100% !important;
    }

    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>
  <!-- Google Translate ki speed badhane ke liye preconnect -->
  <link rel="preconnect" href="https://translate.googleapis.com" />
  <link rel="preconnect" href="https://translate.google.com" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelGo - Login / Sign Up</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <div class="page-container">
    <div class="glass-card">
      
      <!-- Back Link -->
      <a href="index.html" class="back-link">← Back to Home</a>

      <!-- Card Title -->
      <div class="auth-header">
        <h2 id="auth-title">Welcome Back</h2>
        <p class="subtitle" id="auth-subtitle">Log in to manage your bus bookings & fast checkout.</p>
      </div>

      <!-- Tab Switcher -->
      <div class="tab-container">
        <button type="button" class="tab-btn active" id="tab-login">Login</button>
        <button type="button" class="tab-btn" id="tab-signup">Sign Up</button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form active-form">
        <div class="input-group">
          <label><i class="fa-solid fa-envelope"></i> Mobile or Email</label>
          <input type="text" id="login-identifier" placeholder="Enter mobile or email" required>
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="login-password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="submit-btn" id="login-btn">Login & Continue</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" class="auth-form">
        <div class="input-group">
          <label><i class="fa-solid fa-user"></i> Full Name</label>
          <input type="text" id="signup-name" placeholder="Ahmad Hasan Khan" required>
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-phone"></i> Mobile Number</label>
          <input type="tel" id="signup-phone" placeholder="e.g. 8081627647" required>
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="signup-email" placeholder="example@mail.com" required>
        </div>

        <div class="input-group">
          <label><i class="fa-solid fa-lock"></i> Create Password</label>
          <input type="password" id="signup-password" placeholder="Min 6 characters" required>
        </div>

        <button type="submit" class="submit-btn" id="signup-btn">Create Account & Continue</button>
      </form>

      <div class="demo-notice">
        <i class="fa-solid fa-circle-info"></i> Direct login using default credentials or sign up with your details.
      </div>

    </div>
  </div>

  <!-- Custom Glassmorphic Toast Modal -->
  <div id="custom-toast" class="toast-container">
    <div class="toast-card">
      <div class="toast-icon">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <div class="toast-content">
        <h4 id="toast-title">Success!</h4>
        <p id="toast-message">Welcome back!</p>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/auth-check.js"></script>
 <!-- Google Translate Fast Background Engine -->
<div id="google_translate_element" style="display:none;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,hi,bn,mr,te,ta,gu,ur',
      autoDisplay: false,
      multilanguagePage: true
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
