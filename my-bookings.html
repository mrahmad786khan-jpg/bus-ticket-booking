<!DOCTYPE html>
<html lang="en">
<head>
  <head>
  <!-- Baaki ke head elements (title, meta, etc.) -->

  <!-- Google Translate Top Banner Force Hide -->
  <style type="text/css">
    iframe.goog-te-banner-frame,
    .goog-te-banner-frame,
    .goog-te-banner,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    div.skiptranslate,
    #google_translate_element .goog-te-gadget-simple {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
    }

    body {
      top: 0px !important;
      position: static !important;
      min-height: 100% !important;
    }

    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>
  <!-- Google Translate ki speed badhane ke liye preconnect -->
  <link rel="preconnect" href="https://translate.googleapis.com" />
  <link rel="preconnect" href="https://translate.google.com" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelGo - My Bookings</title>
  <link rel="stylesheet" href="css/my-bookings.css">
  
  <!-- Additional CSS for Tabs, Status Badges & Google Translate Dropdown -->
  <style>
    .header-actions {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Filter Tabs Styling */
    .filter-tabs {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: none;
      border: none;
      padding: 10px 15px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      color: #007bff;
    }

    .tab-btn.active {
      color: #007bff;
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 0;
      width: 100%;
      height: 3px;
      background-color: #007bff;
      border-radius: 2px;
    }

    /* Google Translate Integration */
    .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame {
      display: none !important;
    }
    body { top: 0px !important; }
    #google_translate_element select {
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 13px;
      outline: none;
    }
    .goog-te-gadget-icon, .goog-te-gadget span { display: none !important; }
    .goog-te-gadget { font-size: 0px !important; }
  </style>
</head>
<body>

  <div class="page-container">
    <div class="glass-card">
      
      <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
        <a href="index.html" class="back-link">← Home</a>
        <h2>My Bookings</h2>
        
        <div class="header-actions">
          <!-- Google Translate Dropdown -->
          <div id="google_translate_element"></div>
        </div>
      </div>

      <!-- Filter Tabs: All, Upcoming, Completed, Cancelled -->
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="filterBookings('ALL', this)">All</button>
        <button class="tab-btn" onclick="filterBookings('UPCOMING', this)">Upcoming</button>
        <button class="tab-btn" onclick="filterBookings('COMPLETED', this)">Completed</button>
        <button class="tab-btn" onclick="filterBookings('CANCELLED', this)">Cancelled</button>
      </div>

      <div id="bookingsList" class="bookings-list">
        <!-- JS se dynamically booking cards load honge -->
      </div>

    </div>
  </div>

  <script src="js/auth-check.js"></script>
  <script src="js/my-bookings.js"></script>

  <!-- Google Translate Initialization Script -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,bn,mr,ta',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
 <!-- Google Translate Fast Background Engine -->
<div id="google_translate_element" style="display:none;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,hi,bn,mr,te,ta,gu,ur',
      autoDisplay: false,
      multilanguagePage: true
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
