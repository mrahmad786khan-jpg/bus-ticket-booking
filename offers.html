<!DOCTYPE html>
<html lang="en">
<head>
  <head>
  <!-- Baaki ke head elements (title, meta, etc.) -->

  <!-- Google Translate Top Banner Force Hide -->
  <style type="text/css">
    iframe.goog-te-banner-frame,
    .goog-te-banner-frame,
    .goog-te-banner,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    div.skiptranslate,
    #google_translate_element .goog-te-gadget-simple {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
    }

    body {
      top: 0px !important;
      position: static !important;
      min-height: 100% !important;
    }

    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>
  <!-- Google Translate ki speed badhane ke liye preconnect -->
  <link rel="preconnect" href="https://translate.googleapis.com" />
  <link rel="preconnect" href="https://translate.google.com" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelGo - Special Offers</title>
  <link rel="stylesheet" href="css/offers.css">
</head>
<body>

  <div class="page-container">
    <div class="glass-card">
      
      <!-- Card Header -->
      <div class="card-header">
        <a href="index.html" class="back-link">← Back to Home</a>
        <h2>Exclusive Offers & Promo Codes</h2>
        <p class="subtitle">Save big on your next journey with these special discount coupons.</p>
      </div>

      <!-- Offers Grid -->
      <div id="offersList" class="offers-grid">
        <!-- JS dynamically renders offers here -->
      </div>

    </div>
  </div>
 <script src="js/auth-check.js"></script>
  <script src="js/offers.js"></script>
 <!-- Hidden Google Translate Element -->
<div id="google_translate_element" style="display: none;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,hi,bn,mr,te,ta,gu,ur',
      autoDisplay: false
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
