<!DOCTYPE html>
<html lang="en">
<head>
  <head>
  <!-- Baaki ke head elements (title, meta, etc.) -->

  <!-- Google Translate Top Banner Force Hide -->
  <style type="text/css">
    iframe.goog-te-banner-frame,
    .goog-te-banner-frame,
    .goog-te-banner,
    #goog-gt-tt,
    .goog-te-balloon-frame,
    div.skiptranslate,
    #google_translate_element .goog-te-gadget-simple {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      width: 0 !important;
    }

    body {
      top: 0px !important;
      position: static !important;
      min-height: 100% !important;
    }

    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
    }
  </style>
</head>
  <!-- Google Translate ki speed badhane ke liye preconnect -->
  <link rel="preconnect" href="https://translate.googleapis.com" />
  <link rel="preconnect" href="https://translate.google.com" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safar Sathi - Admin Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f1015; color: #e1e1e6; display: flex; min-height: 100vh; }
    
    /* Sidebar */
    .sidebar { width: 250px; background-color: #161722; padding: 20px; border-right: 1px solid #282a36; }
    .sidebar h2 { color: #ff5555; margin-bottom: 30px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
    .menu-item { display: block; padding: 12px 15px; color: #a9a9b3; text-decoration: none; border-radius: 8px; margin-bottom: 10px; font-weight: 500; }
    .menu-item.active, .menu-item:hover { background-color: #ff5555; color: #fff; }
    
    /* Main Content */
    .main-content { flex: 1; padding: 30px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    
    /* Stats Cards */
    .stats-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { background-color: #161722; padding: 20px; border-radius: 12px; border: 1px solid #282a36; }
    .card h3 { font-size: 14px; color: #a9a9b3; margin-bottom: 10px; }
    .card p { font-size: 26px; font-weight: bold; color: #50fa7b; }

    /* Section Forms & Tables */
    .section-box { background-color: #161722; padding: 25px; border-radius: 12px; border: 1px solid #282a36; margin-bottom: 30px; }
    .section-box h3 { margin-bottom: 20px; color: #f8f8f2; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
    input { padding: 10px 12px; background-color: #0f1015; border: 1px solid #282a36; border-radius: 6px; color: #fff; }
    button.btn-add { padding: 12px 20px; background-color: #ff5555; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button.btn-add:hover { background-color: #ff3333; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { text-align: left; padding: 12px; border-bottom: 1px solid #282a36; }
    th { color: #bd93f9; }
    .btn-delete { background-color: #ff5555; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h2><i class="fa-solid fa-bus"></i> Safar Sathi</h2>
    <a href="#" class="menu-item active"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
    <button onclick="logoutAdmin()" class="menu-item" style="width:100%; text-align:left; background:none; border:none; cursor:pointer; margin-top:50px;"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1>Admin Control Panel</h1>
      <span id="admin-name" style="color: #50fa7b; font-weight: bold;">Welcome, Admin</span>
    </div>

    <!-- Analytics Cards -->
    <div class="stats-container">
      <div class="card">
        <h3>TOTAL REVENUE</h3>
        <p id="total-revenue">₹0</p>
      </div>
      <div class="card">
        <h3>TOTAL BOOKINGS</h3>
        <p id="total-bookings" style="color: #8be9fd;">0</p>
      </div>
      <div class="card">
        <h3>ACTIVE BUSES</h3>
        <p id="total-buses" style="color: #ffb86c;">0</p>
      </div>
    </div>

    <!-- Add Bus Form -->
    <div class="section-box">
      <h3><i class="fa-solid fa-plus"></i> Add New Bus Route</h3>
      <form id="add-bus-form">
        <div class="form-grid">
          <input type="text" id="bus_name" placeholder="Bus Name (e.g. Raj Express)" required>
          <input type="text" id="bus_number" placeholder="Bus Number (e.g. UP 70 AB 1234)" required>
          <input type="text" id="source" placeholder="Source City" required>
          <input type="text" id="destination" placeholder="Destination City" required>
          <input type="text" id="departure_time" placeholder="Departure (e.g. 08:00 AM)" required>
          <input type="text" id="arrival_time" placeholder="Arrival (e.g. 04:00 PM)" required>
          <input type="number" id="fare" placeholder="Ticket Fare (₹)" required>
        </div>
        <button type="submit" class="btn-add">Add Bus to System</button>
      </form>
    </div>

    <!-- Active Buses Table -->
    <div class="section-box">
      <h3><i class="fa-solid fa-bus-simple"></i> Active Bus Fleet</h3>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Bus Name</th>
            <th>Number</th>
            <th>Route</th>
            <th>Timing</th>
            <th>Fare</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="buses-table-body">
          <!-- Dynamic Bus Rows -->
        </tbody>
      </table>
    </div>

    <!-- Bookings Table -->
    <div class="section-box">
      <h3><i class="fa-solid fa-ticket"></i> Recent Passenger Bookings</h3>
      <table>
        <thead>
          <tr>
            <th>PNR</th>
            <th>Passenger</th>
            <th>Route</th>
            <th>Seat No</th>
            <th>Fare Paid</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="bookings-table-body">
          <!-- Dynamic Booking Rows -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <!-- Google Translate Fast Background Engine -->
<div id="google_translate_element" style="display:none;"></div>

<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,hi,bn,mr,te,ta,gu,ur',
      autoDisplay: false,
      multilanguagePage: true
    }, 'google_translate_element');
  }
</script>
<script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
